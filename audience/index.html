<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poll</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #fafafa; --fg: #1a1a1a; --card: #fff; --line: #ddd; --accent: #b22222; --muted: #666; --ok: #2e8b57; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --card: #1c1c1c; --line: #333; --muted: #aaa; } }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 32em; margin: 0 auto; padding: 1.2em 1em 3em; }
  h1 { font-size: 1.35em; line-height: 1.3; margin: 0.2em 0 0.8em; }
  .muted { color: var(--muted); font-size: 0.9em; }
  .btn { display: block; width: 100%; text-align: left; font: inherit; font-size: 1.05em; padding: 0.9em 1em; margin: 0.5em 0; border: 2px solid var(--line); border-radius: 0.6em; background: var(--card); color: var(--fg); cursor: pointer; }
  .btn:active { transform: scale(0.99); }
  .btn.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .btn.selected::after { content: " ✓"; color: var(--accent); font-weight: 700; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); text-align: center; }
  .btn.secondary { text-align: center; }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .btn .ord { display: inline-block; min-width: 1.6em; height: 1.6em; line-height: 1.6em; text-align: center; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; margin-right: 0.5em; font-size: 0.9em; }
  .scale { display: flex; gap: 0.4em; margin: 0.6em 0; }
  .scale .btn { text-align: center; padding: 0.8em 0.2em; margin: 0; flex: 1; }
  .scale .btn.selected::after { content: ""; }
  .scale-labels { display: flex; justify-content: space-between; font-size: 0.8em; color: var(--muted); }
  input[type=text], textarea { width: 100%; font: inherit; font-size: 1.05em; padding: 0.8em; border: 2px solid var(--line); border-radius: 0.6em; background: var(--card); color: var(--fg); }
  .cards { display: flex; flex-direction: column; gap: 0.5em; }
  .card { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 0.4em; padding: 0.6em 0.8em; white-space: pre-wrap; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4em; align-items: center; margin: 0.35em 0; font-size: 0.95em; }
  .row .label { text-align: right; }
  .row.correct .label { color: var(--ok); font-weight: 700; }
  .row.correct .fill { background: var(--ok); }
  .track { background: rgba(127,127,127,0.2); height: 1em; border-radius: 0.25em; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); transition: width 0.4s; }
  .count { font-size: 0.85em; color: var(--muted); }
  .badge { display: inline-block; font-size: 0.8em; padding: 0.15em 0.6em; border-radius: 1em; background: var(--line); margin-bottom: 0.6em; }
  .badge.open { background: var(--ok); color: #fff; }
  .badge.closed { background: var(--accent); color: #fff; }
  .timer { float: right; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1em; }
  .timer.urgent { color: var(--accent); }
  .verdict { font-size: 1.3em; font-weight: 700; margin: 0.6em 0 0.2em; }
  .verdict.right { color: var(--ok); }
  .verdict.wrong { color: var(--accent); }
  ol.scores, ol.ranking { list-style: none; padding: 0; margin: 0.5em 0; }
  ol.scores li, ol.ranking li { display: grid; grid-template-columns: 2em 1fr auto; gap: 0.5em; padding: 0.4em 0.2em; border-bottom: 1px solid var(--line); }
  ol.scores li.me { font-weight: 700; color: var(--accent); }
  .name { font-size: 0.85em; color: var(--muted); margin-bottom: 0.5em; }
  .name a { color: var(--accent); }
  .toast { position: fixed; left: 50%; bottom: 1.2em; transform: translateX(-50%); background: #333; color: #fff; padding: 0.6em 1em; border-radius: 0.5em; font-size: 0.95em; display: none; max-width: 90vw; }
  .cloud { display: flex; flex-wrap: wrap; gap: 0.3em 0.7em; justify-content: center; align-items: center; line-height: 1.1; }
  .cloud span { color: var(--accent); }
  .cloud span.correct { color: var(--ok); font-weight: 700; }
  footer { margin-top: 2em; font-size: 0.75em; color: var(--muted); }
</style>
</head>
<body>
<main id="app"><p class="muted">…</p></main>
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';
  // Fallback database when the QR code does not carry one (set this to your own Firebase URL).
  const DEFAULT_DB = 'https://quarto-poll-default-rtdb.europe-west1.firebasedatabase.app';

  const I18N = {
    da: { title: 'Afstemning', enterCode: 'Skriv koden fra skærmen.', code: 'Kode', join: 'Deltag', wait: 'Vent på næste spørgsmål …',
          open: 'Åben', closed: 'Lukket', answers: 'svar', tap: 'Tryk på et svar.', change: 'Du kan ændre dit svar, så længe afstemningen er åben.',
          yourAnswer: 'Dit svar', send: 'Send', placeholder: 'Dit svar', isClosed: 'Afstemningen er lukket.', none: 'Ingen svar endnu',
          saved: 'Dit svar er registreret', rejected: 'Afstemningen er lukket', failed: 'Kunne ikke sende svar', offline: 'Ingen forbindelse',
          lost: 'Mistede forbindelsen. Genindlæs siden.', quizName: 'Det er en quiz. Hvad skal vi kalde dig?', namePlaceholder: 'Dit navn',
          saveName: 'Gem', nameSaved: 'Navn gemt', you: 'Du spiller som', changeName: 'skift', right: 'Rigtigt!', wrong: 'Forkert',
          noAnswer: 'Du svarede ikke', correctWas: 'Rigtigt svar', points: 'point', total: 'Du har i alt', scores: 'Stilling', anonymous: 'Anonym',
          multiHint: 'Vælg alle, der passer, og tryk Send.', rankHint: 'Tryk på svarene i den rækkefølge, du vil have dem.', clear: 'Start forfra',
          mean: 'Gennemsnit', seconds: 's', timeUp: 'Tiden er gået', yourOrder: 'Din rækkefølge' },
    en: { title: 'Poll', enterCode: 'Enter the code shown on screen.', code: 'Code', join: 'Join', wait: 'Waiting for the next question …',
          open: 'Open', closed: 'Closed', answers: 'answers', tap: 'Tap an answer.', change: 'You can change your answer while the poll is open.',
          yourAnswer: 'Your answer', send: 'Send', placeholder: 'Your answer', isClosed: 'The poll is closed.', none: 'No answers yet',
          saved: 'Answer saved', rejected: 'The poll is closed', failed: 'Could not send the answer', offline: 'No connection',
          lost: 'Connection lost. Reload the page.', quizName: 'This is a quiz. What should we call you?', namePlaceholder: 'Your name',
          saveName: 'Save', nameSaved: 'Name saved', you: 'You play as', changeName: 'change', right: 'Correct!', wrong: 'Wrong',
          noAnswer: 'You did not answer', correctWas: 'Correct answer', points: 'points', total: 'Your total', scores: 'Scores', anonymous: 'Anonymous',
          multiHint: 'Select all that apply and tap Send.', rankHint: 'Tap the answers in the order you prefer.', clear: 'Start over',
          mean: 'Mean', seconds: 's', timeUp: 'Time is up', yourOrder: 'Your order' },
  };

  const q = new URLSearchParams(location.search);
  const room = (q.get('r') || '').trim();
  const db = (q.get('db') || DEFAULT_DB).replace(/\/+$/, '');
  const T = I18N[q.get('l')] || I18N.da;
  let mode = q.get('m') === 'p' ? 'polling' : 'stream';
  document.documentElement.lang = I18N[q.get('l')] ? q.get('l') : 'da';
  document.title = T.title;
  const app = document.getElementById('app');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const norm = (s) => String(s).trim().toLowerCase().replace(/\s+/g, ' ');

  let dev, myName = '';
  try {
    dev = localStorage.getItem('poll-device');
    if (!dev || !/^d[a-z0-9]{8,40}$/.test(dev)) { dev = 'd' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem('poll-device', dev); }
    myName = localStorage.getItem('poll-name') || '';
  } catch (e) { dev = 'd' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 2500);
  }

  if (!room) {
    app.innerHTML = `<h1>${T.title}</h1><p class="muted">${T.enterCode}</p>
      <form id="f"><input type="text" id="code" placeholder="${T.code}" autocomplete="off" autocapitalize="none">
      <button class="btn primary" type="submit">${T.join}</button></form>`;
    document.getElementById('f').addEventListener('submit', (e) => {
      e.preventDefault();
      const c = document.getElementById('code').value.trim();
      if (!c) return;
      const p = new URLSearchParams(location.search);
      p.set('r', c);
      location.search = '?' + p.toString();
    });
    return;
  }

  let data = {};
  let draft = '';
  let picked = [];          // multi: selected indices; rank: tapped order
  let pickedFor = null;     // poll id the picks belong to
  let editingName = false;
  let nameSync = false;
  let lastJson = '';

  function setPath(root, path, val) {
    const parts = path.split('/').filter(Boolean);
    if (!parts.length) return val === null || val === undefined ? {} : val;
    if (typeof root !== 'object' || root === null) root = {};
    let node = root;
    for (let i = 0; i < parts.length - 1; i++) {
      if (typeof node[parts[i]] !== 'object' || node[parts[i]] === null) node[parts[i]] = {};
      node = node[parts[i]];
    }
    const last = parts[parts.length - 1];
    if (val === null || val === undefined) delete node[last]; else node[last] = val;
    return root;
  }

  /* Two transports: a server-sent event stream (one database connection per phone) or
   * plain polling every few seconds (no persistent connection, so the free plan's
   * 100-connection limit does not apply). Streaming falls back to polling on error. */
  function listen() {
    if (mode === 'polling') { poll(); return; }
    const es = new EventSource(`${db}/pub/${encodeURIComponent(room)}.json`);
    es.addEventListener('put', (e) => { const m = JSON.parse(e.data); data = m.path === '/' ? (m.data || {}) : setPath(data, m.path, m.data); render(); });
    es.addEventListener('patch', (e) => { const m = JSON.parse(e.data); Object.keys(m.data || {}).forEach((k) => { data = setPath(data, m.path + '/' + k, m.data[k]); }); render(); });
    es.onerror = () => { if (es.readyState === EventSource.CLOSED) { mode = 'polling'; poll(); } };
  }
  async function poll() {
    try {
      const r = await fetch(`${db}/pub/${encodeURIComponent(room)}.json`, { cache: 'no-store' });
      if (r.ok) {
        const txt = await r.text();
        if (txt !== lastJson) { lastJson = txt; data = JSON.parse(txt) || {}; render(); }
      }
    } catch (e) { /* try again */ }
    const p = active();
    setTimeout(poll, p && p.state === 'open' ? 2000 : 5000);
  }
  function active() { return data.active && data.polls ? data.polls[data.active] : null; }

  async function put(path, value) {
    return fetch(`${db}/pub/${encodeURIComponent(room)}${path}.json`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(value),
    });
  }

  async function vote(pollId, value) {
    try {
      const r = await put(`/polls/${encodeURIComponent(pollId)}/votes/${dev}`, value);
      if (r.ok) {
        toast(T.saved);
        const p = data.polls && data.polls[pollId];
        if (p && p.speed) put(`/polls/${encodeURIComponent(pollId)}/times/${dev}`, { '.sv': 'timestamp' }).catch(() => {});
        if (mode === 'polling') { data = setPath(data, `/polls/${pollId}/votes/${dev}`, value); render(); }
      } else toast(r.status === 401 || r.status === 403 ? T.rejected : T.failed + ' (' + r.status + ')');
    } catch (e) { toast(T.offline); }
  }

  async function saveName(name) {
    name = name.trim().slice(0, 24);
    if (!name) return;
    try {
      const r = await put(`/names/${dev}`, name);
      if (!r.ok) { toast(T.failed + ' (' + r.status + ')'); return; }
      myName = name; editingName = false;
      try { localStorage.setItem('poll-name', name); } catch (e) { /* ignore */ }
      if (mode === 'polling') data = setPath(data, `/names/${dev}`, name);
      toast(T.nameSaved);
      render();
    } catch (e) { toast(T.offline); }
  }

  /* ---------- scoring (same rules as the deck) ---------- */
  function isCorrect(p, v) {
    if (!p || !p.quiz || p.correct === undefined || p.correct === null || v === undefined) return false;
    if (p.type === 'multi') return typeof v === 'string' && v.split(',').map(Number).sort((a, b) => a - b).join(',') === String(p.correct);
    if (p.type === 'text') return typeof v === 'string' && String(p.correct).split('|').includes(norm(v));
    return v === p.correct;
  }
  function pointsFor(p, d) {
    if (!isCorrect(p, p.votes && p.votes[d])) return 0;
    const base = Number(p.points || 1);
    if (p.speed && p.time && p.opened && p.times && typeof p.times[d] === 'number') {
      const f = Math.min(1, Math.max(0, (p.times[d] - p.opened) / (p.time * 1000)));
      return Math.round(base * (1 - 0.5 * f));
    }
    return base;
  }
  function scores() {
    const totals = {};
    Object.values(data.polls || {}).forEach((p) => {
      if (!p || !p.quiz || !p.votes) return;
      Object.keys(p.votes).forEach((d) => { const pts = pointsFor(p, d); if (pts) totals[d] = (totals[d] || 0) + pts; });
    });
    const names = data.names || {};
    return Object.keys(totals).map((d) => ({ dev: d, name: names[d] || T.anonymous, points: totals[d] }))
      .sort((a, b) => b.points - a.points || a.name.localeCompare(b.name));
  }
  function scoreboard() {
    const rows = scores();
    if (!rows.length) return '';
    const mine = rows.find((r) => r.dev === dev);
    let rank = 0, prev = null;
    const top = rows.slice(0, 5).map((r, i) => {
      if (r.points !== prev) { rank = i + 1; prev = r.points; }
      return `<li class="${r.dev === dev ? 'me' : ''}"><span>${rank}</span><span>${esc(r.name)}</span><span>${r.points} ${T.points}</span></li>`;
    }).join('');
    return `<p class="muted">${T.total}: <b>${mine ? mine.points : 0} ${T.points}</b></p><p class="muted">${T.scores}</p><ol class="scores">${top}</ol>`;
  }

  /* ---------- charts ---------- */
  function barRows(options, counts, total, correctSet) {
    const max = Math.max(1, ...counts);
    return options.map((o, i) => `<div class="row${correctSet && correctSet.has(i) ? ' correct' : ''}"><div class="label">${esc(o)}</div>
      <div><div class="track"><div class="fill" style="width:${(100 * counts[i] / max).toFixed(1)}%"></div></div>
      <div class="count">${counts[i]}${total ? ' (' + Math.round(100 * counts[i] / total) + '%)' : ''}</div></div></div>`).join('');
  }
  function bars(options, votes, correct) {
    const counts = options.map(() => 0);
    votes.forEach((v) => { if (Number.isInteger(v) && counts[v] !== undefined) counts[v]++; });
    return barRows(options, counts, votes.length, Number.isInteger(correct) ? new Set([correct]) : null);
  }
  function multiBars(options, votes, correct) {
    const counts = options.map(() => 0);
    votes.forEach((v) => { if (typeof v === 'string') v.split(',').forEach((i) => { if (counts[Number(i)] !== undefined) counts[Number(i)]++; }); });
    return barRows(options, counts, votes.length, typeof correct === 'string' ? new Set(correct.split(',').map(Number)) : null);
  }
  function scaleChart(p, options, votes) {
    const counts = options.map(() => 0);
    let sum = 0, n = 0;
    votes.forEach((v) => { if (Number.isInteger(v) && counts[v] !== undefined) { counts[v]++; sum += v; n++; } });
    const min = Number(p.min !== undefined && p.min !== null ? p.min : 1);
    return barRows(options, counts, votes.length, null) + (n ? `<p>${T.mean}: <b>${(min + sum / n).toFixed(2)}</b></p>` : '');
  }
  function rankChart(options, votes) {
    const sums = options.map(() => 0), ns = options.map(() => 0);
    votes.forEach((v) => { if (typeof v !== 'string') return; v.split(',').forEach((idx, pos) => { const i = Number(idx); if (sums[i] !== undefined) { sums[i] += pos + 1; ns[i]++; } }); });
    if (!votes.length) return `<p class="muted">${T.none}</p>`;
    const rows = options.map((o, i) => ({ o, mean: ns[i] ? sums[i] / ns[i] : null })).sort((a, b) => (a.mean === null) - (b.mean === null) || a.mean - b.mean);
    return '<ol class="ranking">' + rows.map((r, i) => `<li><span>${i + 1}</span><span>${esc(r.o)}</span><span>${r.mean === null ? '' : r.mean.toFixed(2)}</span></li>`).join('') + '</ol>';
  }
  function cloud(votes, correct) {
    const accepted = typeof correct === 'string' ? new Set(correct.split('|')) : null;
    const m = new Map();
    votes.forEach((v) => { if (typeof v !== 'string') return; const k = v.trim(); if (!k) return; const key = k.toLowerCase(); const c = m.get(key) || { text: k, n: 0, ok: accepted ? accepted.has(key) : false }; c.n++; m.set(key, c); });
    const items = [...m.values()];
    if (!items.length) return `<p class="muted">${T.none}</p>`;
    const max = Math.max(...items.map((x) => x.n));
    return '<div class="cloud">' + items.map((x) => `<span class="${x.ok ? 'correct' : ''}" style="font-size:${(0.9 + 1.4 * x.n / max).toFixed(2)}em">${esc(x.text)}</span>`).join(' ') + '</div>';
  }
  function cards(votes) {
    const items = votes.filter((v) => typeof v === 'string' && v.trim());
    if (!items.length) return `<p class="muted">${T.none}</p>`;
    return '<div class="cards">' + items.map((v) => `<div class="card">${esc(v.trim())}</div>`).join('') + '</div>';
  }
  function chart(p, votes, correct) {
    const o = p.options || [];
    return p.type === 'text' ? cloud(votes, correct) : p.type === 'open' ? cards(votes) : p.type === 'multi' ? multiBars(o, votes, correct)
      : p.type === 'scale' ? scaleChart(p, o, votes) : p.type === 'rank' ? rankChart(o, votes) : bars(o, votes, correct);
  }

  function remaining(p) {
    if (!p || p.state !== 'open' || !p.time || typeof p.opened !== 'number') return null;
    return Math.max(0, Math.ceil((p.opened + p.time * 1000 - Date.now()) / 1000));
  }
  setInterval(() => {
    const p = active(); const left = remaining(p); const t = document.querySelector('.timer');
    if (t && left !== null) { t.textContent = `${left} ${T.seconds}`; t.classList.toggle('urgent', left <= 5); }
  }, 250);

  function nameForm(prompt) {
    return `${prompt ? `<p>${prompt}</p>` : ''}<form id="nf"><input type="text" id="ni" maxlength="24" placeholder="${T.namePlaceholder}" autocomplete="off" value="${esc(myName)}">
      <button class="btn primary" type="submit">${T.saveName}</button></form>`;
  }

  function render() {
    const id = data.active;
    const poll = active();
    if (!poll) {
      app.innerHTML = `<h1>${T.title}</h1><p class="muted">${T.wait}</p><footer>${T.code}: ${esc(room)}</footer>`;
      return;
    }
    if (pickedFor !== id) { picked = []; pickedFor = id; }
    const votes = poll.votes ? Object.values(poll.votes) : [];
    const mine = poll.votes ? poll.votes[dev] : undefined;
    const open = poll.state === 'open';
    const options = poll.options || [];
    const correct = poll.quiz && !open && poll.correct !== undefined && poll.correct !== null ? poll.correct : null;
    const left = remaining(poll);
    let html = `<span class="badge ${open ? 'open' : 'closed'}">${open ? T.open : T.closed} · ${votes.length} ${T.answers}</span>`;
    if (left !== null) html += `<span class="timer${left <= 5 ? ' urgent' : ''}">${left} ${T.seconds}</span>`;

    if (poll.quiz && (!myName || editingName)) {
      html += `<h1>${esc(poll.question || '')}</h1>` + nameForm(T.quizName) + `<footer>${T.code}: ${esc(room)}</footer>`;
      app.innerHTML = html;
      bindName();
      return;
    }
    if (poll.quiz) {
      html += `<div class="name">${T.you} <b>${esc(myName)}</b> (<a href="#" id="chg">${T.changeName}</a>)</div>`;
      /* Re-send the name if the presenter reset the room (names are kept on the phone). */
      if (!(data.names && data.names[dev] === myName) && !nameSync) {
        nameSync = true;
        put(`/names/${dev}`, myName).catch(() => {}).then(() => { setTimeout(() => { nameSync = false; }, 3000); });
      }
    }
    html += `<h1>${esc(poll.question || '')}</h1>`;

    if (open && poll.type === 'choice') {
      html += options.map((o, i) => `<button class="btn ${mine === i ? 'selected' : ''}" data-i="${i}">${esc(o)}</button>`).join('');
      html += `<p class="muted">${mine === undefined ? T.tap : T.change}</p>`;
    } else if (open && poll.type === 'scale') {
      html += `<div class="scale">` + options.map((o, i) => `<button class="btn ${mine === i ? 'selected' : ''}" data-i="${i}">${esc(o)}</button>`).join('') + `</div>`;
      html += `<p class="muted">${mine === undefined ? T.tap : T.change}</p>`;
    } else if (open && poll.type === 'multi') {
      const current = picked.length ? picked : (typeof mine === 'string' ? mine.split(',').map(Number) : []);
      html += options.map((o, i) => `<button class="btn ${current.includes(i) ? 'selected' : ''}" data-m="${i}">${esc(o)}</button>`).join('');
      html += `<button class="btn primary" id="sendm" ${current.length ? '' : 'disabled'}>${T.send}</button><p class="muted">${T.multiHint}</p>`;
    } else if (open && poll.type === 'rank') {
      html += `<p class="muted">${T.rankHint}</p>`;
      html += options.map((o, i) => { const pos = picked.indexOf(i); return `<button class="btn ${pos >= 0 ? 'selected' : ''}" data-r="${i}">${pos >= 0 ? `<span class="ord">${pos + 1}</span>` : ''}${esc(o)}</button>`; }).join('');
      html += `<button class="btn primary" id="sendr" ${picked.length === options.length ? '' : 'disabled'}>${T.send}</button><button class="btn secondary" id="clearr">${T.clear}</button>`;
      if (typeof mine === 'string') html += `<p class="muted">${T.yourOrder}: ${esc(mine.split(',').map((i) => options[Number(i)]).join(' → '))}</p>`;
    } else if (open && poll.type === 'text') {
      html += `<form id="tf"><input type="text" id="ti" maxlength="80" placeholder="${T.placeholder}" autocomplete="off" value="${esc(draft)}">
        <button class="btn primary" type="submit">${T.send}</button></form>
        ${mine !== undefined ? `<p class="muted">${T.yourAnswer}: <b>${esc(mine)}</b></p>` : ''}`;
    } else if (open && poll.type === 'open') {
      html += `<form id="tf"><textarea id="ti" maxlength="300" rows="4" placeholder="${T.placeholder}">${esc(draft)}</textarea>
        <button class="btn primary" type="submit">${T.send}</button></form>
        ${mine !== undefined ? `<p class="muted">${T.yourAnswer}: <b>${esc(mine)}</b></p>` : ''}`;
    } else {
      if (correct !== null) {
        const pts = pointsFor(poll, dev);
        const v = mine === undefined ? `<div class="verdict wrong">${T.noAnswer}</div>`
          : pts ? `<div class="verdict right">${T.right} +${pts} ${T.points}</div>` : `<div class="verdict wrong">${T.wrong}</div>`;
        const shown = poll.type === 'multi' ? String(correct).split(',').map((i) => options[Number(i)]).join(', ')
          : poll.type === 'text' ? String(correct).split('|')[0] : options[correct];
        html += v + `<p class="muted">${T.correctWas}: <b>${esc(shown || '')}</b></p>`;
      }
      html += chart(poll, votes, correct);
      html += `<p class="muted">${T.isClosed}</p>`;
      if (poll.quiz) html += scoreboard();
    }
    html += `<footer>${T.code}: ${esc(room)}</footer>`;
    app.innerHTML = html;

    app.querySelectorAll('button[data-i]').forEach((b) => b.addEventListener('click', () => vote(id, Number(b.dataset.i))));
    app.querySelectorAll('button[data-m]').forEach((b) => b.addEventListener('click', () => {
      const i = Number(b.dataset.m);
      if (!picked.length && typeof mine === 'string') picked = mine.split(',').map(Number);
      picked = picked.includes(i) ? picked.filter((x) => x !== i) : picked.concat(i);
      if (!picked.length) picked = [-1]; // keep an explicit empty pick so the stored vote is not shown as selected
      render();
    }));
    const sendm = document.getElementById('sendm');
    if (sendm) sendm.addEventListener('click', () => { const v = picked.filter((x) => x >= 0).sort((a, b) => a - b).join(','); if (v) vote(id, v); });
    app.querySelectorAll('button[data-r]').forEach((b) => b.addEventListener('click', () => { const i = Number(b.dataset.r); if (!picked.includes(i)) { picked = picked.concat(i); render(); } }));
    const sendr = document.getElementById('sendr');
    if (sendr) sendr.addEventListener('click', () => { if (picked.length === options.length) vote(id, picked.join(',')); });
    const clearr = document.getElementById('clearr');
    if (clearr) clearr.addEventListener('click', () => { picked = []; render(); });
    const tf = document.getElementById('tf');
    if (tf) {
      const ti = document.getElementById('ti');
      ti.addEventListener('input', () => { draft = ti.value; });
      tf.addEventListener('submit', (e) => { e.preventDefault(); const v = ti.value.trim(); if (v) { vote(id, v); draft = ''; } });
    }
    const chg = document.getElementById('chg');
    if (chg) chg.addEventListener('click', (e) => { e.preventDefault(); editingName = true; render(); });
  }

  function bindName() {
    const nf = document.getElementById('nf');
    if (nf) nf.addEventListener('submit', (e) => { e.preventDefault(); saveName(document.getElementById('ni').value); });
  }

  listen();
})();
</script>
</body>
</html>
